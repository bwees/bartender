[platformio]
; native is test-only (pio test -e native); without this a bare `pio run`
; tries to build it as a program and fails.
default_envs = advance-hmi

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:advance-hmi]
; platform = espressif32
; ONLY change from Elecrow's file. Their platform is IDF 5.3, which glitches here.
; This is Arduino Core 3.0.2 / IDF 5.1.4 — the exact pair the working factory image
; was built with. NOT 3.0.7/5.1.4 (pioarduino 51.03.07): that glitches too, so the
; core version matters as well as the IDF version.
platform = https://github.com/tasmota/platform-espressif32/releases/download/2024.07.11/platform-espressif32.zip
board = ESP32-S3-WROOM-1-N16R8
framework = arduino
monitor_speed = 115200

board_build.arduino.partitions = partitions.csv
board_upload.partitions = partitions.csv

; Set the PSRAM to Octal mode and specify the clock frequency.
build_flags =
  -DCONFIG_SPIRAM_SPEED_120M=1  ; 120MHz
  -Iinclude
  -D LV_CONF_INCLUDE_SIMPLE
  -std=gnu++17
  -Ilib/storage
  -Ilib/portal
  -Ilib/cup
  -Ilib/pour
  -Ilib/hmi
  -Ilib/cjson

; lib_deps = 
;   lovyan03/LovyanGFX@^1.2.0
;   tamctec/TAMC_GT911@^1.0.2
;   lvgl/lvgl@8.3.11
;   adafruit/Adafruit SSD1306@^1.0.2
lib_deps =
  ; Pinned exactly. lvgl 8.3.11 is byte-identical to Elecrow's vendored copy
  ; (verified by diff); LovyanGFX 1.2.28 was confirmed on hardware. LVGL 9 tears on
  ; this panel, so the major version is load-bearing, not a floor.
  lvgl/lvgl@8.3.11
  lovyan03/LovyanGFX@1.2.28

[env:native]
platform = native
build_flags =
  -std=gnu++17
  -D SDCARD_DIR='"${PROJECT_DIR}/../sdcard"'
  -Ilib/storage
  -Ilib/pour
  -Ilib/hmi
  -Ilib/portal
  -Ilib/cjson
